name: Agent task
description: A scoped change with testable acceptance criteria
title: '[Agent] '
labels: ['agent:ready']
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain the behavior or maintenance change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include target project, runtime, tests, compatibility, and non-goals.
    validations:
      required: true
